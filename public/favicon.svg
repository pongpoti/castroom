  <rect width="64" height="64" rx="14" fill="#ffffff" />
  <rect x="20" y="8" width="8" height="28" rx="4" fill="none" stroke="#073835" stroke-width="4" />
  <rect x="36" y="8" width="8" height="26" rx="4" fill="none" stroke="#073835" stroke-width="4" />
  <circle cx="26" cy="44" r="5" fill="#073835" />
  <circle cx="33" cy="49" r="5" fill="#073835" />
  <circle cx="40" cy="44" r="5" fill="#073835" />
</svg>
